<script>
(function(){
  var btn=document.querySelector(".theme-switch");
  if(!btn)return;
  var root=document.documentElement;
  function sync(){
    var d=root.dataset.theme==="dark";
    btn.setAttribute("aria-checked",d?"true":"false");
    var m=document.querySelector('meta[name="theme-color"]');
    if(m)m.setAttribute("content",d?"#1f1e1b":"#faf9f5");
  }
  sync();
  btn.addEventListener("click",function(e){
    var next=root.dataset.theme==="dark"?"light":"dark";
    function apply(){
      root.dataset.theme=next;
      try{localStorage.setItem("theme",next);}catch(_){}
      sync();
    }
    var reduced=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if(document.startViewTransition&&!reduced){
      var x=e.clientX||window.innerWidth-70;
      var y=e.clientY||40;
      var r=Math.hypot(Math.max(x,window.innerWidth-x),Math.max(y,window.innerHeight-y));
      var vt=document.startViewTransition(apply);
      vt.ready.then(function(){
        root.animate(
          {clipPath:["circle(0px at "+x+"px "+y+"px)","circle("+r+"px at "+x+"px "+y+"px)"]},
          {duration:750,easing:"ease-in-out",pseudoElement:"::view-transition-new(root)"}
        );
      }).catch(function(){});
    }else{
      root.classList.add("theming");
      apply();
      setTimeout(function(){root.classList.remove("theming");},500);
    }
  });
})();
</script>
